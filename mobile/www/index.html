<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Budget Control</title>

  <!-- Installation PWA (iOS « Sur l'ecran d'accueil », Android « Installer ») -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget Control">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-header">
  <h1>
    <span id="page-title">Budget Control</span>
    <span class="sub" id="page-subtitle"></span>
  </h1>
  <div class="header-actions">
    <a class="icon-btn" href="#/reports" title="Rapports">📊</a>
    <a class="icon-btn" href="#/settings" title="Parametres">
      ⚙️<span class="badge-dot" id="badge" hidden></span>
    </a>
  </div>
</header>

<main id="view"></main>

<nav class="tabbar">
  <a href="#/" data-tab="dashboard"><span class="ico">🏠</span> Accueil</a>
  <a href="#/history" data-tab="history"><span class="ico">📜</span> Historique</a>
  <a href="#/goals" data-tab="goals"><span class="ico">🐖</span> Epargne</a>
  <a href="#/incomes" data-tab="incomes"><span class="ico">💵</span> Revenus</a>
  <a href="#/budgets" data-tab="budgets"><span class="ico">🎯</span> Budgets</a>
</nav>

<!-- Verrou PIN optionnel (defini dans les parametres) -->
<div id="lock" class="lock-screen" hidden>
  <div class="lock-box">
    <div class="lock-logo">🔒</div>
    <h2>Budget Control</h2>
    <p>Saisissez votre code</p>
    <input id="lock-pin" type="password" inputmode="numeric" maxlength="8"
           autocomplete="off" class="amount-input" style="text-align:center">
    <div id="lock-error" class="errorlist" hidden>Code incorrect.</div>
    <button class="btn btn-block" id="lock-btn">Deverrouiller</button>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/services.js"></script>
<script src="js/seed.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>

<script>
  // Service worker : uniquement en contexte web securise (Safari/Chrome).
  // Inutile dans l'APK Android (origine appassets.local), qui sert deja tout en
  // local via son intercepteur natif — on l'y desactive pour ne rien changer.
  if ('serviceWorker' in navigator
      && location.protocol.startsWith('http')
      && location.hostname !== 'appassets.local') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* sans effet */ });
    });
  }
</script>
</body>
</html>
