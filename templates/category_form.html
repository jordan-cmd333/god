{% extends 'base.html' %}

{% block title %}Modifier une categorie{% endblock %}
{% block page_title %}Modifier « {{ category.name }} »{% endblock %}

{% block content %}
<form method="post" class="card">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <div class="btn-row">
    <button class="btn">Enregistrer</button>
    <a href="{% url 'category_list' %}" class="btn btn-ghost">Annuler</a>
  </div>
</form>
{% endblock %}
