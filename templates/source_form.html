{% extends 'base.html' %}

{% block title %}Modifier une source{% endblock %}
{% block page_title %}Modifier « {{ source.name }} »{% endblock %}

{% block content %}
<form method="post" class="card">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <div class="btn-row">
    <button class="btn btn-income">Enregistrer</button>
    <a href="{% url 'source_list' %}" class="btn btn-ghost">Annuler</a>
  </div>
</form>
{% endblock %}
